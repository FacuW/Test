name: "Static Analysis"
description: "Run static analysis tools (cppcheck, scan-build, valgrind)"

runs:
  using: "composite"
  steps:
    - name: Install static analysis tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck clang-tools valgrind

    - name: Create suppressions file
      shell: bash
      run: |
        cat > cppcheck_suppressions.txt << EOF
        missingIncludeSystem
        unusedFunction
        constParameter
        constParameterCallback
        constParameterPointer
        unusedStructMember
        variableScope
        knownConditionTrueFalse
        EOF

    - name: Run cppcheck
      shell: bash
      run: |
        PROJECT_PATH=$(pwd)
        ERROR_FILE=$PROJECT_PATH/cppcheck_errors.txt
        
        echo "Running cppcheck..."
        cppcheck --enable=warning,style,performance,portability \
                 --error-exitcode=0 \
                 --suppressions-list=cppcheck_suppressions.txt \
                 --inline-suppr \
                 --quiet \
                 --std=c11 \
                 --platform=unix64 \
                 --force \
                 src/ include/ \
                 2> $ERROR_FILE
        
        # Filtrar solo errores críticos (error y algunos warnings importantes)
        grep -E "(error:|warning:)" $ERROR_FILE | \
        grep -v "missingIncludeSystem" | \
        grep -v "unusedFunction" | \
        grep -v "constParameter" | \
        grep -v "variableScope" > critical_errors.txt || true
        
        if [ -s critical_errors.txt ]; then
          echo "Critical cppcheck issues found:"
          cat critical_errors.txt
          
          # Solo fallar si hay errores reales, no warnings menores
          if grep -q "error:" critical_errors.txt; then
            echo "Found actual errors, failing..."
            exit 1
          else
            echo "Only minor warnings found, continuing..."
          fi
        else
          echo "cppcheck: No critical issues found"
        fi

    - name: Run scan-build
      shell: bash
      run: |
        PROJECT_PATH=$(pwd)
        SCAN_BUILD_DIR=$PROJECT_PATH/scan-build-results
        
        # Limpiar directorio previo
        rm -rf $SCAN_BUILD_DIR
        mkdir -p $SCAN_BUILD_DIR
        
        echo "Running scan-build..."
        
        # Crear build directory para scan-build
        mkdir -p build-scan
        cd build-scan
        
        # Configurar con Conan si está disponible
        if command -v conan &> /dev/null; then
          conan profile detect --force
          conan install .. --output-folder=. --build=missing --settings=build_type=Debug || true
        fi
        
        # Ejecutar scan-build con configuración más permisiva
        scan-build -o $SCAN_BUILD_DIR \
                   --keep-going \
                   -enable-checker alpha.deadcode.UnreachableCode \
                   -enable-checker alpha.core.CastSize \
                   cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake || true
        
        scan-build -o $SCAN_BUILD_DIR \
                   --keep-going \
                   -enable-checker alpha.deadcode.UnreachableCode \
                   -enable-checker alpha.core.CastSize \
                   cmake --build . || echo "Build completed with warnings"
        
        # Verificar resultados pero no fallar automáticamente
        if [ -d "$SCAN_BUILD_DIR" ] && [ "$(find $SCAN_BUILD_DIR -name "*.html" | wc -l)" -gt 0 ]; then
          echo "scan-build found potential issues (uploaded as artifacts for review)"
          ls -la $SCAN_BUILD_DIR
        else
          echo "scan-build: No issues found"
        fi

    - name: Run valgrind on tests (if built)
      shell: bash
      run: |
        PROJECT_PATH=$(pwd)
        
        echo "Running valgrind on tests..."
        
        cd build || {
          echo "Build directory not found, skipping valgrind"
          exit 0
        }
        
        # Ejecutar valgrind en los tests si existen
        VALGRIND_FAILED=0
        
        if [ -f "./test_main" ]; then
          echo "Running valgrind on test_main..."
          timeout 60 valgrind --tool=memcheck \
                   --leak-check=full \
                   --show-leak-kinds=definite,possible \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   --gen-suppressions=all \
                   ./test_main 2>&1 | tee valgrind_test_main.log || VALGRIND_FAILED=1
        fi
        
        if [ -f "./test_metrics" ]; then
          echo "Running valgrind on test_metrics..."
          timeout 60 valgrind --tool=memcheck \
                   --leak-check=full \
                   --show-leak-kinds=definite,possible \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   --gen-suppressions=all \
                   ./test_metrics 2>&1 | tee valgrind_test_metrics.log || VALGRIND_FAILED=1
        fi
        
        if [ $VALGRIND_FAILED -eq 1 ]; then
          echo "valgrind found memory issues"
          exit 1
        else
          echo "valgrind: No critical memory issues found"
        fi

    - name: Upload static analysis results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: static-analysis-results
        path: |
          ./cppcheck_errors.txt
          ./critical_errors.txt
          ./cppcheck_suppressions.txt
          ./scan-build-results/
          ./build/valgrind_*.log
        retention-days: 3
